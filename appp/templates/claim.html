<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claim Your NFT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='claim.css') }}">
</head>
<body>
  <main class="claim-container">
    <h1>🎉 Congratulations!</h1>
    <p>You successfully completed the quiz for <strong>{{ category|capitalize }}</strong>.</p>

    <!-- Category image -->
    <img class="reward-img"
      src="{% if category == 'gaming' %}
              {{ url_for('static', filename='gamingpic.jpg') }}
           {% elif category == 'builders' %}
              {{ url_for('static', filename='builderspic.jpg') }}
           {% elif category == 'nft' %}
              {{ url_for('static', filename='nftpic.jpg') }}
           {% else %}
              {{ url_for('static', filename='defaultpic.jpg') }}
           {% endif %}"
      alt="{{ category }} reward">

    <!-- Wallet form -->
    <form method="POST" class="claim-form">
      <label for="wallet">Enter your wallet address:</label>
      <input type="text" id="wallet" name="wallet" required placeholder="0x...">
      <button type="submit">Claim NFT</button>
    </form>
  </main>
</body>
</html>
